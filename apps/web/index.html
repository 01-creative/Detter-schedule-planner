<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <title>Detter · 先做最重要的事</title>
    <meta name="description" content="Detter：本地优先的四象限日程管理器。3 秒捕获，离线可用。" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E0E12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Detter" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- iOS 主屏图标只认 apple-touch-icon，且必须是 png（svg 会被忽略，退化成网页截图） -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-180.png" />
    <!-- 首帧主题：必须是外链脚本，内联会被生产环境的 CSP（script-src 'self'）拦掉 -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Detter 需要启用 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
